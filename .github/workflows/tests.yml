name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mapper-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / GraphQLite ${{ matrix.graphqlite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        graphqlite: ['8.0.0', 'latest-8.x']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install GraphQLite 8.0 dependencies
        if: matrix.graphqlite == '8.0.0'
        run: composer update --with 'thecodingmachine/graphqlite:8.0.0' --prefer-dist --no-interaction --no-progress
      - name: Install latest compatible GraphQLite 8.x dependencies
        if: matrix.graphqlite == 'latest-8.x'
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Verify platform and SQLite connection
        run: |
          composer check-platform-reqs
          php -r 'new PDO("sqlite::memory:", options: [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);'
          composer show thecodingmachine/graphqlite
      - name: Run mapper integration tests
        run: composer test -- --fail-on-skipped
